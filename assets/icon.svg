<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- whoisthere app icon: "Night terminal" intercom panel. Drawn on a 100-unit grid,
       scaled so the rounded square fills the 824px macOS icon body on a 1024 canvas. -->
  <defs>
    <clipPath id="body"><rect x="6" y="6" width="88" height="88" rx="20"/></clipPath>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141922"/><stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".7"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <g transform="translate(43.82 43.82) scale(9.3636)">
    <g filter="url(#shadow)"><rect x="6" y="6" width="88" height="88" rx="20" fill="#05070a"/></g>
    <g clip-path="url(#body)">
      <rect width="100" height="100" fill="url(#night)"/>
      <rect x="21" y="14" width="58" height="72" rx="8" fill="#10151d" stroke="#2b3443" stroke-width="1"/>
      <g font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="7.5" font-weight="700" text-anchor="middle">
        <rect x="27" y="22" width="34" height="11" rx="2" fill="#0a0e14" stroke="#1f2a37" stroke-width=".8"/>
        <text x="44" y="27.5" dy=".35em" fill="#4ade80" opacity=".55">3000</text>
        <rect x="27" y="37" width="34" height="11" rx="2" fill="#0a0e14" stroke="#2f6b46" stroke-width=".8"/>
        <text x="44" y="42.5" dy=".35em" fill="#86efac">5173</text>
        <rect x="27" y="52" width="34" height="11" rx="2" fill="#0a0e14" stroke="#1f2a37" stroke-width=".8"/>
        <text x="44" y="57.5" dy=".35em" fill="#4ade80" opacity=".55">8080</text>
      </g>
      <circle cx="69" cy="27.5" r="3.4" fill="none" stroke="#3a4555" stroke-width="1.2"/>
      <circle cx="69" cy="42.5" r="9" fill="url(#glow)"/>
      <circle cx="69" cy="42.5" r="3.4" fill="#4ade80"/>
      <circle cx="69" cy="57.5" r="3.4" fill="none" stroke="#3a4555" stroke-width="1.2"/>
      <g stroke="#263040" stroke-width="1.8" stroke-linecap="round">
        <line x1="34" y1="71" x2="66" y2="71"/><line x1="34" y1="77" x2="66" y2="77"/>
      </g>
    </g>
  </g>
</svg>
